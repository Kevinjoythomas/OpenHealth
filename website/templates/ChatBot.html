<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>OpenHealth Consultation Chat</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'gray-900': '#1A1A1A', // Darkest background (sidebar)
            'gray-800': '#242424', // Main chat background
            'gray-700': '#333333', // Lighter elements (input, user message)
            'gray-600': '#424242', // AI message background
            'teal-500': '#00897B', // Primary teal
            'teal-600': '#00796B', // Hover teal
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
          }
        }
      }
    }
  </script>
<style data-purpose="custom-utilities">
    /* Custom scrollbar for webkit */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #424242;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #555;
    }
  </style>
</head>
<body class="bg-gray-900 text-gray-200 font-sans h-screen flex overflow-hidden selection:bg-teal-500 selection:text-white">
<!-- BEGIN: Sidebar -->
<aside class="w-64 bg-gray-900 flex flex-col flex-shrink-0 border-r border-gray-800">
<!-- Header/Logo -->
<div class="p-4 flex items-center gap-3">
<div class="w-8 h-8 flex items-center justify-center text-teal-500">
<svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="1.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M12 9v6m-3-3h6" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="text-xl font-bold text-white tracking-tight">OpenHealth</span>
</div>
<!-- Navigation/Actions -->
<div class="px-3 py-2 flex flex-col gap-1">
<button onclick="newConsultation()" class="w-full flex items-center gap-2 bg-teal-500 hover:bg-teal-600 text-white px-3 py-2.5 rounded-lg font-medium transition-colors duration-200">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 4.5v15m7.5-7.5h-15" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
        New consultation
      </button>
<div class="mt-4 flex flex-col gap-1">
<button class="w-full flex items-center gap-3 px-3 py-2 text-sm text-gray-300 hover:bg-gray-800 hover:text-white rounded-lg transition-colors duration-200">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
          Search
        </button>
<button class="w-full flex items-center gap-3 px-3 py-2 text-sm text-gray-300 hover:bg-gray-800 hover:text-white rounded-lg transition-colors duration-200">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M10.5 6h9.75M10.5 6a1.5 1.5 0 1 1-3 0m3 0a1.5 1.5 0 1 0-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-3.75 0H7.5m9-6h3.75m-3.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-9.75 0h9.75" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
          Customize
        </button>
</div>
</div>
<!-- Recent Consultations List -->
<div class="flex-1 overflow-y-auto mt-4 px-3 pb-4">
<h3 class="text-xs font-medium text-gray-500 px-3 mb-2 uppercase tracking-wider">Recent consultations</h3>
<ul id="sessionList" class="space-y-1">
</ul>
</div>
<!-- User Profile Footer -->
<div class="border-t border-gray-800 p-3">
<button onclick="logout()" class="w-full flex items-center justify-between p-2 hover:bg-gray-800 rounded-lg transition-colors duration-200">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-gray-700 flex items-center justify-center text-teal-500 text-sm font-bold" id="userAvatar">P</div>
<div class="text-left">
<p class="text-sm font-medium text-white leading-tight" id="userName">Patient</p>
<p class="text-xs text-gray-500 leading-tight">Sign out</p>
</div>
</div>
<svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" stroke-width="1.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</aside>
<!-- END: Sidebar -->
<!-- BEGIN: Main Chat Area -->
<main class="flex-1 bg-gray-800 flex flex-col h-full relative">
<!-- Header -->
<header class="h-14 border-b border-gray-700 flex items-center justify-between px-6 sticky top-0 bg-gray-800 z-10">
<h1 class="text-lg font-semibold text-white">Consultation Chat</h1>
<button class="text-gray-400 hover:text-white transition-colors">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</header>
<!-- Chat History -->
<div id="chatScroll" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-6 flex flex-col">
<div id="messagesContainer" class="max-w-3xl mx-auto w-full space-y-6 pb-24">
<!-- Typing Indicator (hidden by default) -->
<div id="typing" class="hidden flex gap-4 items-center pl-12">
<div class="flex space-x-1 items-center">
<div class="w-1.5 h-1.5 bg-gray-500 rounded-full animate-bounce" style="animation-delay: 0s;"></div>
<div class="w-1.5 h-1.5 bg-gray-500 rounded-full animate-bounce" style="animation-delay: 0.2s;"></div>
<div class="w-1.5 h-1.5 bg-gray-500 rounded-full animate-bounce" style="animation-delay: 0.4s;"></div>
</div>
<span class="text-sm text-gray-500">Doctor is typing...</span>
</div>
</div>
</div>
<!-- Input Area -->
<div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-gray-800 via-gray-800 to-transparent pt-6 pb-4 px-4 sm:px-6">
<div class="max-w-3xl mx-auto">
<div class="relative flex items-end gap-2 bg-gray-700 rounded-xl border border-gray-600 p-2 shadow-lg focus-within:border-gray-500 focus-within:ring-1 focus-within:ring-gray-500 transition-all">
<textarea id="msgInput" onkeydown="handleKey(event)" class="block w-full resize-none border-0 bg-transparent py-2.5 px-3 text-gray-200 placeholder-gray-400 focus:ring-0 sm:text-sm sm:leading-6 max-h-32" placeholder="Ask OpenHealth..." rows="1" style="min-height: 44px;"></textarea>
<div class="flex items-center gap-2 pb-1 pr-1">
<button id="sendBtn" onclick="sendMessage()" class="bg-teal-500 hover:bg-teal-600 disabled:opacity-40 disabled:cursor-not-allowed text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">
              Send
            </button>
<button class="text-gray-400 hover:text-white p-2 rounded-lg transition-colors">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 18.75a6 6 0 0 0 6-6v-1.5m-6 7.5a6 6 0 0 1-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 0 1-3-3V4.5a3 3 0 1 1 6 0v8.25a3 3 0 0 1-3 3Z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</div>
<!-- Disclaimer -->
<p class="text-center text-xs text-gray-500 mt-3">
          AI-generated medical guidance. Always consult a real doctor.
        </p>
</div>
</div>
</main>
<!-- END: Main Chat Area -->

<script>
const API = 'https://nonsignificantly-untippled-mikaela.ngrok-free.dev';
const H = { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' };
let sessionId = null;
let token = localStorage.getItem('access_token');
let sessions = [];

if (!token) window.location.href = '/login';

function authHeaders() {
    return { ...H, 'Authorization': `Bearer ${token}` };
}

// ── Sessions ──────────────────────────────────────────────────────────

async function loadSessions() {
    try {
        const res = await fetch(`${API}/v1/chat/sessions`, { headers: authHeaders() });
        if (res.status === 401) { window.location.href = '/login'; return; }
        const data = await res.json();
        sessions = Array.isArray(data) ? data : (data.sessions || []);
        renderSessionList();
    } catch (e) { console.log('Could not load sessions:', e); }
}

function draftSessionTitle(text) {
    const cleaned = (text || '').replace(/\s+/g, ' ').trim();
    if (!cleaned) return 'New consultation';
    if (cleaned.length <= 60) return cleaned;
    let truncated = cleaned.slice(0, 57).trim();
    const lastSpace = truncated.lastIndexOf(' ');
    if (lastSpace > 24) truncated = truncated.slice(0, lastSpace);
    return truncated + '...';
}

function getSessionTitle(session) {
    const title = session?.title?.trim() || '';
    return title || 'New consultation';
}

function renderSessionList() {
    const ul = document.getElementById('sessionList');
    ul.innerHTML = '';
    sessions.forEach(s => {
        const li = document.createElement('li');
        const title = getSessionTitle(s);
        const active = s.id === sessionId;
        li.innerHTML = '<a href="#" onclick="switchSession(\'' + s.id + '\'); return false;" class="block px-3 py-2 text-sm ' +
            (active ? 'bg-gray-800 text-white' : 'text-gray-400 hover:bg-gray-800 hover:text-white') +
            ' rounded-lg transition-colors duration-200 truncate">' + escapeHtml(title) + '</a>';
        ul.appendChild(li);
    });
}

async function switchSession(id) {
    sessionId = id;
    renderSessionList();
    clearChat();
    appendWelcome();
    try {
        const res = await fetch(`${API}/v1/chat/sessions/${id}/messages`, { headers: authHeaders() });
        if (!res.ok) return;
        const data = await res.json();
        const msgs = Array.isArray(data) ? data : (data.messages || []);
        msgs.forEach(m => {
            const role = (m.role === 'user' || m.role === 'human') ? 'user' : 'doctor';
            appendMessage(role, m.content || m.message || m.text || '');
        });
    } catch (e) { console.log('Could not load messages:', e); }
}

async function newConsultation() {
    clearChat();
    appendWelcome();
    try {
        const res = await fetch(`${API}/v1/chat/sessions`, {
            method: 'POST', headers: authHeaders(),
            body: JSON.stringify({}),
        });
        if (res.status === 401) { window.location.href = '/login'; return; }
        const data = await res.json();
        sessionId = data.id;
        await loadSessions();
    } catch (e) {
        appendMessage('doctor', 'Could not connect to server. Please ensure all services are running.');
    }
}

// ── Chat ──────────────────────────────────────────────────────────────

function clearChat() {
    const container = document.getElementById('messagesContainer');
    const typing = document.getElementById('typing');
    container.innerHTML = '';
    container.appendChild(typing);
}

function appendWelcome() {
    appendMessage('doctor', "Hello! I'm your OpenHealth medical assistant. Describe your symptoms and I'll provide guidance based on clinical references. How can I help you today?");
}

function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
}

function formatResponse(text) {
    let main = text, footer = '';
    const srcMatch = text.match(/\n\n\*Sources:(.*)\*/s);
    const noDocMatch = text.match(/\n\n\*No relevant documents.*\*/s);
    if (srcMatch) {
        main = text.slice(0, srcMatch.index);
        footer = '<div class="mt-3 pt-3 border-t border-gray-500/30 text-xs text-gray-400">Sources: ' + escapeHtml(srcMatch[1].trim()) + '</div>';
    } else if (noDocMatch) {
        main = text.slice(0, noDocMatch.index);
        footer = '<div class="mt-3 pt-3 border-t border-gray-500/30 text-xs text-gray-400 italic">Answer based on model training knowledge.</div>';
    }
    return escapeHtml(main).replace(/\n/g, '<br>') + footer;
}

function appendMessage(role, text) {
    const container = document.getElementById('messagesContainer');
    const typing = document.getElementById('typing');
    const div = document.createElement('div');

    if (role === 'user') {
        div.className = 'flex justify-end';
        div.innerHTML = '<div class="bg-gray-700 text-gray-100 px-5 py-3.5 rounded-2xl rounded-tr-sm max-w-[85%] text-[15px] leading-relaxed shadow-sm">' + escapeHtml(text) + '</div>';
    } else {
        div.className = 'flex gap-4 items-start';
        div.innerHTML =
            '<div class="flex-shrink-0 w-8 h-8 rounded-full bg-teal-600 flex items-center justify-center text-white mt-1">' +
                '<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">' +
                    '<path d="M15.042 21.672 13.684 16.6m0 0-2.51 2.225.569-9.47 5.227 7.917-3.286-.672Zm-7.518-.267A8.25 8.25 0 1 1 20.25 10.5M8.288 14.212A5.25 5.25 0 1 1 17.25 10.5" stroke-linecap="round" stroke-linejoin="round"></path>' +
                '</svg>' +
            '</div>' +
            '<div class="space-y-3 max-w-[85%] text-gray-200">' +
                '<div class="bg-gray-600 px-5 py-3.5 rounded-2xl rounded-tl-sm text-[15px] leading-relaxed shadow-sm">' + formatResponse(text) + '</div>' +
            '</div>';
    }
    container.insertBefore(div, typing);
    document.getElementById('chatScroll').scrollTop = document.getElementById('chatScroll').scrollHeight;
}

function setTyping(on) {
    document.getElementById('typing').classList.toggle('hidden', !on);
    document.getElementById('sendBtn').disabled = on;
    document.getElementById('msgInput').disabled = on;
    document.getElementById('chatScroll').scrollTop = document.getElementById('chatScroll').scrollHeight;
}

async function sendMessage() {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if (!text || !sessionId) return;

    input.value = '';
    input.style.height = '44px';
    appendMessage('user', text);
    setTyping(true);

    try {
        const res = await fetch(`${API}/v1/chat/sessions/${sessionId}/messages`, {
            method: 'POST', headers: authHeaders(),
            body: JSON.stringify({ message: text }),
        });
        if (res.status === 401) { window.location.href = '/login'; return; }
        const data = await res.json();
        appendMessage('doctor', data.answer || data.assistant_message?.content || data.reply || JSON.stringify(data));
        const sess = sessions.find(s => s.id === sessionId);
        if (sess) {
            sess.title = (data.title || '').trim() || draftSessionTitle(text);
            renderSessionList();
        }
    } catch (e) {
        appendMessage('doctor', 'Error reaching server. Please try again.');
    } finally {
        setTyping(false);
    }
}

function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    // Auto-resize
    const ta = e.target;
    requestAnimationFrame(() => { ta.style.height = '44px'; ta.style.height = Math.min(ta.scrollHeight, 128) + 'px'; });
}

function logout() {
    localStorage.removeItem('access_token');
    localStorage.removeItem('refresh_token');
    window.location.href = '/login';
}

// ── Init ──────────────────────────────────────────────────────────────

async function init() {
    await loadSessions();
    if (sessions.length > 0) {
        sessionId = sessions[0].id;
        renderSessionList();
        await switchSession(sessionId);
    } else {
        await newConsultation();
    }
}

init();
</script>
</body></html>
