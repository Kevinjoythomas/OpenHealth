<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>OpenHealth — Consultation</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@200;300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'gray-900': '#1A1A1A',
            'gray-800': '#242424',
            'gray-700': '#333333',
            'gray-600': '#424242',
            'teal-500': '#00897B',
            'teal-600': '#00796B',
          },
          fontFamily: {
            sans: ['Outfit', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            serif: ['Instrument Serif', 'Georgia', 'serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
</script>
<style>
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#424242;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#555}
/* Mobile sidebar */
@media(max-width:768px){
  #sidebar{position:fixed;left:0;top:48px;bottom:0;z-index:40;transform:translateX(-100%);transition:transform 0.3s ease}
  #sidebar.open{transform:translateX(0)}
  #sidebarOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:35}
  #sidebarOverlay.open{display:block}
  .top-nav{height:48px!important}
}
@media(min-width:769px){
  #sidebarOverlay{display:none!important}
  .hamburger-btn{display:none!important}
}
</style>
</head>
<body class="bg-[#1A1A1A] text-gray-200 font-sans h-screen flex flex-col overflow-hidden selection:bg-[#00897B] selection:text-white">

<!-- Top Navbar -->
<nav class="top-nav h-12 bg-[#111917] border-b border-[#1e2d28] flex items-center justify-between px-4 flex-shrink-0 z-50">
  <div class="flex items-center gap-3">
    <button class="hamburger-btn text-gray-400 hover:text-white lg:hidden" onclick="toggleSidebar()">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <a href="/" class="flex items-center gap-2 text-decoration-none">
      <svg class="w-5 h-5 text-[#00897B]" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 9v6m-3-3h6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="font-serif text-lg text-white">OpenHealth</span>
    </a>
  </div>
  <div class="flex items-center gap-5">
    <a href="/" class="text-xs text-gray-400 hover:text-white transition-colors hidden sm:block">Home</a>
    <a href="/#results" class="text-xs text-gray-400 hover:text-white transition-colors hidden sm:block">Results</a>
    <a href="/#architecture" class="text-xs text-gray-400 hover:text-white transition-colors hidden sm:block">Architecture</a>
    <button onclick="logout()" class="text-xs text-gray-400 hover:text-[#00897B] transition-colors font-mono">Sign out</button>
  </div>
</nav>

<!-- Main layout -->
<div class="flex flex-1 overflow-hidden">

<!-- Sidebar overlay (mobile) -->
<div id="sidebarOverlay" onclick="toggleSidebar()"></div>

<!-- Sidebar -->
<aside id="sidebar" class="w-64 bg-gray-900 flex flex-col flex-shrink-0 border-r border-gray-800">
<div class="px-3 py-3 flex flex-col gap-1">
<button onclick="newConsultation()" class="w-full flex items-center gap-2 bg-teal-500 hover:bg-teal-600 text-white px-3 py-2.5 rounded-lg font-medium transition-colors duration-200 text-sm">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 4.5v15m7.5-7.5h-15" stroke-linecap="round" stroke-linejoin="round"/></svg>
New consultation
</button>
</div>
<div class="flex-1 overflow-y-auto mt-2 px-3 pb-4">
<h3 class="text-xs font-medium text-gray-500 px-3 mb-2 uppercase tracking-wider font-mono">Recent</h3>
<ul id="sessionList" class="space-y-1"></ul>
</div>
<div class="border-t border-gray-800 p-3">
<div class="flex items-center gap-3 p-2">
<div class="w-7 h-7 rounded-full bg-gray-700 flex items-center justify-center text-teal-500 text-xs font-bold font-mono" id="userAvatar">P</div>
<div><p class="text-xs font-medium text-white leading-tight" id="userName">Patient</p><p class="text-[10px] text-gray-500 leading-tight font-mono">Online</p></div>
</div>
</div>
</aside>

<!-- Main Chat Area -->
<main class="flex-1 bg-gray-800 flex flex-col h-full relative">
<header class="h-12 border-b border-gray-700 flex items-center justify-between px-5 flex-shrink-0 bg-gray-800">
<h1 class="text-sm font-medium text-white">Consultation Chat</h1>
<div class="flex items-center gap-2"><span class="w-1.5 h-1.5 rounded-full bg-green-500"></span><span class="text-[11px] text-gray-500 font-mono">Connected</span></div>
</header>

<div id="chatScroll" class="flex-1 overflow-y-auto p-4 sm:p-6 flex flex-col">
<div id="messagesContainer" class="max-w-3xl mx-auto w-full space-y-6 pb-24">
<div id="typing" class="hidden flex gap-4 items-center pl-12">
<div class="flex space-x-1 items-center">
<div class="w-1.5 h-1.5 bg-gray-500 rounded-full animate-bounce" style="animation-delay:0s"></div>
<div class="w-1.5 h-1.5 bg-gray-500 rounded-full animate-bounce" style="animation-delay:0.2s"></div>
<div class="w-1.5 h-1.5 bg-gray-500 rounded-full animate-bounce" style="animation-delay:0.4s"></div>
</div>
<span class="text-sm text-gray-500">Doctor is typing...</span>
</div>
</div>
</div>

<div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-gray-800 via-gray-800 to-transparent pt-6 pb-4 px-4 sm:px-6">
<div class="max-w-3xl mx-auto">
<div class="relative flex items-end gap-2 bg-gray-700 rounded-xl border border-gray-600 p-2 shadow-lg focus-within:border-gray-500 focus-within:ring-1 focus-within:ring-gray-500 transition-all">
<textarea id="msgInput" onkeydown="handleKey(event)" class="block w-full resize-none border-0 bg-transparent py-2.5 px-3 text-gray-200 placeholder-gray-400 focus:ring-0 text-sm leading-6 max-h-32" placeholder="Describe your symptoms..." rows="1" style="min-height:44px"></textarea>
<div class="flex items-center gap-2 pb-1 pr-1">
<button id="sendBtn" onclick="sendMessage()" class="bg-teal-500 hover:bg-teal-600 disabled:opacity-40 disabled:cursor-not-allowed text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">Send</button>
</div>
</div>
<p class="text-center text-[11px] text-gray-500 mt-3 font-mono">AI-generated medical guidance. Always consult a real doctor.</p>
</div>
</div>
</main>
</div>

<script>
const API = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
    ? 'http://localhost:5000'
    : 'https://nonsignificantly-untippled-mikaela.ngrok-free.dev';
const H = { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' };
let sessionId = null;
let token = localStorage.getItem('access_token');
let sessions = [];

if (!token) window.location.href = '/login';

function authHeaders() { return { ...H, 'Authorization': 'Bearer ' + token }; }

function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebarOverlay').classList.toggle('open');
}

async function loadSessions() {
    try {
        var res = await fetch(API + '/v1/chat/sessions', { headers: authHeaders() });
        if (res.status === 401) { window.location.href = '/login'; return; }
        var data = await res.json();
        sessions = Array.isArray(data) ? data : (data.sessions || []);
        renderSessionList();
    } catch (e) { console.log('Could not load sessions:', e); }
}

function draftSessionTitle(text) {
    var cleaned = (text || '').replace(/\s+/g, ' ').trim();
    if (!cleaned) return 'New consultation';
    if (cleaned.length <= 60) return cleaned;
    var truncated = cleaned.slice(0, 57).trim();
    var lastSpace = truncated.lastIndexOf(' ');
    if (lastSpace > 24) truncated = truncated.slice(0, lastSpace);
    return truncated + '...';
}

function getSessionTitle(session) {
    var title = session && session.title ? session.title.trim() : '';
    return title || 'New consultation';
}

function renderSessionList() {
    var ul = document.getElementById('sessionList');
    ul.innerHTML = '';
    sessions.forEach(function(s) {
        var title = getSessionTitle(s);
        var active = s.id === sessionId;
        var li = document.createElement('li');
        var a = document.createElement('a');
        a.href = '#';
        a.className = 'block px-3 py-2 text-sm ' + (active ? 'bg-gray-800 text-white' : 'text-gray-400 hover:bg-gray-800 hover:text-white') + ' rounded-lg transition-colors duration-200 truncate';
        a.textContent = title;
        a.onclick = function(e) { e.preventDefault(); switchSession(s.id); if(window.innerWidth<769) toggleSidebar(); };
        li.appendChild(a);
        ul.appendChild(li);
    });
}

async function switchSession(id) {
    sessionId = id; renderSessionList(); clearChat(); appendWelcome();
    try {
        var res = await fetch(API + '/v1/chat/sessions/' + id + '/messages', { headers: authHeaders() });
        if (!res.ok) return;
        var data = await res.json();
        var msgs = Array.isArray(data) ? data : (data.messages || []);
        msgs.forEach(function(m) {
            var role = (m.role === 'user' || m.role === 'human') ? 'user' : 'doctor';
            appendMessage(role, m.content || m.message || m.text || '');
        });
    } catch (e) { console.log('Could not load messages:', e); }
}

async function newConsultation() {
    clearChat(); appendWelcome();
    if(window.innerWidth<769) toggleSidebar();
    try {
        var res = await fetch(API + '/v1/chat/sessions', { method: 'POST', headers: authHeaders(), body: JSON.stringify({}) });
        if (res.status === 401) { window.location.href = '/login'; return; }
        var data = await res.json();
        sessionId = data.id;
        await loadSessions();
    } catch (e) { appendMessage('doctor', 'Could not connect to server.'); }
}

function clearChat() {
    var c = document.getElementById('messagesContainer');
    var t = document.getElementById('typing');
    c.innerHTML = ''; c.appendChild(t);
}

function appendWelcome() {
    appendMessage('doctor', "Hello! I'm your OpenHealth medical assistant. Describe your symptoms and I'll provide guidance based on clinical references. How can I help you today?");
}

function escapeHtml(str) { var d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

function formatResponse(text) {
    var main = text, footer = '';
    var srcMatch = text.match(/\n\n\*Sources:(.*)\*/s);
    var noDocMatch = text.match(/\n\n\*No relevant documents.*\*/s);
    if (srcMatch) {
        main = text.slice(0, srcMatch.index);
        footer = '<div class="mt-3 pt-3 border-t border-gray-500/30 text-xs text-gray-400 font-mono">Sources: ' + escapeHtml(srcMatch[1].trim()) + '</div>';
    } else if (noDocMatch) {
        main = text.slice(0, noDocMatch.index);
        footer = '<div class="mt-3 pt-3 border-t border-gray-500/30 text-xs text-gray-400 italic">Answer based on model training knowledge.</div>';
    }
    return escapeHtml(main).replace(/\n/g, '<br>') + footer;
}

function appendMessage(role, text) {
    var container = document.getElementById('messagesContainer');
    var typing = document.getElementById('typing');
    var div = document.createElement('div');
    if (role === 'user') {
        div.className = 'flex justify-end';
        div.innerHTML = '<div class="bg-gray-700 text-gray-100 px-5 py-3.5 rounded-2xl rounded-tr-sm max-w-[85%] text-[15px] leading-relaxed shadow-sm">' + escapeHtml(text) + '</div>';
    } else {
        div.className = 'flex gap-4 items-start';
        div.innerHTML =
            '<div class="flex-shrink-0 w-8 h-8 rounded-full bg-teal-600 flex items-center justify-center text-white mt-1">' +
                '<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M15.042 21.672 13.684 16.6m0 0-2.51 2.225.569-9.47 5.227 7.917-3.286-.672Zm-7.518-.267A8.25 8.25 0 1 1 20.25 10.5M8.288 14.212A5.25 5.25 0 1 1 17.25 10.5" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
            '</div>' +
            '<div class="space-y-3 max-w-[85%] text-gray-200">' +
                '<div class="bg-gray-600 px-5 py-3.5 rounded-2xl rounded-tl-sm text-[15px] leading-relaxed shadow-sm">' + formatResponse(text) + '</div>' +
            '</div>';
    }
    container.insertBefore(div, typing);
    document.getElementById('chatScroll').scrollTop = document.getElementById('chatScroll').scrollHeight;
}

function setTyping(on) {
    document.getElementById('typing').classList.toggle('hidden', !on);
    document.getElementById('sendBtn').disabled = on;
    document.getElementById('msgInput').disabled = on;
    document.getElementById('chatScroll').scrollTop = document.getElementById('chatScroll').scrollHeight;
}

async function sendMessage() {
    var input = document.getElementById('msgInput');
    var text = input.value.trim();
    if (!text || !sessionId) return;
    input.value = ''; input.style.height = '44px';
    appendMessage('user', text); setTyping(true);
    try {
        var res = await fetch(API + '/v1/chat/sessions/' + sessionId + '/messages', { method: 'POST', headers: authHeaders(), body: JSON.stringify({ message: text }) });
        if (res.status === 401) { window.location.href = '/login'; return; }
        var data = await res.json();
        var answer = data.answer || (data.assistant_message && data.assistant_message.content) || data.reply || JSON.stringify(data);
        appendMessage('doctor', answer);
        var sess = sessions.find(function(s) { return s.id === sessionId; });
        if (sess) {
            sess.title = (data.title || '').trim() || draftSessionTitle(text);
            renderSessionList();
        }
    } catch (e) { appendMessage('doctor', 'Error reaching server. Please try again.'); }
    finally { setTyping(false); }
}

function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    var ta = e.target;
    requestAnimationFrame(function() { ta.style.height = '44px'; ta.style.height = Math.min(ta.scrollHeight, 128) + 'px'; });
}

function logout() { localStorage.removeItem('access_token'); localStorage.removeItem('refresh_token'); window.location.href = '/login'; }

async function init() {
    await loadSessions();
    if (sessions.length > 0) { sessionId = sessions[0].id; renderSessionList(); await switchSession(sessionId); }
    else { await newConsultation(); }
}
init();
</script>
</body></html>
